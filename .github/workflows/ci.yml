name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate the extension libraries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the pilot validator
        uses: actions/cache@v4
        with:
          path: build/pilot-validator
          key: pilot-validator-${{ hashFiles('scripts/pilot-pin.sh', 'scripts/download-pilot-validator.sh', 'scripts/download-pilot-sysml-validator.sh', 'scripts/verify-pilot-pin.sh') }}
          restore-keys: pilot-validator-

      - name: Verify the pilot pin
        run: ./scripts/verify-pilot-pin.sh

      - name: Validate the libraries
        run: ./scripts/validate-libraries.sh

      - name: Check the README library table
        run: ./scripts/check-readme-table.sh

      - name: Check the engine contract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-engine-contract.sh --base "origin/${{ github.base_ref }}"
          else
            ./scripts/check-engine-contract.sh
          fi

      - name: Build the project archive
        run: ./scripts/build-kpar.py --version "0.0.0-dev.${{ github.run_number }}+${GITHUB_SHA::7}" --output opensysml-extension-libraries-dev.kpar

      - name: Upload the project archive
        uses: actions/upload-artifact@v4
        with:
          name: opensysml-extension-libraries-dev
          path: opensysml-extension-libraries-dev.kpar

  opensysml-mirror:
    name: OpenSysML against these libraries (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: extensions

      - name: Check out OpenSysML
        uses: actions/checkout@v4
        with:
          repository: Open-MBEE/OpenSysML
          ref: develop
          path: opensysml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opensysml/go.mod

      - name: Install z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Install cvc5
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
          echo "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/cvc5.zip" | sha256sum --check --strict
          unzip -p /tmp/cvc5.zip '*/bin/cvc5' > /tmp/cvc5-bin
          sudo install -m 0755 /tmp/cvc5-bin /usr/local/bin/cvc5
          cvc5 --version | head -1

      - name: Run OpenSysML against these libraries
        env:
          EXTENSIONS_DIR: ${{ github.workspace }}/extensions
        run: |
          cd "$GITHUB_WORKSPACE/opensysml"
          if [ ! -f scripts/sync-extension-libraries.sh ]; then
            echo "OpenSysML does not yet vendor from this repository (no sync-extension-libraries.sh); skipping."
            exit 0
          fi
          scripts/sync-extension-libraries.sh --source "$EXTENSIONS_DIR"
          make stdlib-snapshot-check || make stdlib-snapshot
          go test ./internal/workspace/libs/... ./internal/exec/... ./internal/ir/... ./internal/doc/... ./internal/semantic/... ./internal/check/... ./internal/translate/... ./tests/hygiene/...
