name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the project archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify the pilot pin
        run: ./scripts/verify-pilot-pin.sh

      - name: Validate the libraries
        run: ./scripts/validate-libraries.sh

      - name: Build the project archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/build-kpar.py --version "$version" --output "opensysml-extension-libraries-${version}.kpar"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          kpar="opensysml-extension-libraries-${version}.kpar"
          gh release create "$GITHUB_REF_NAME" "$kpar" \
            --verify-tag \
            --title "OpenSysML Extension Libraries $GITHUB_REF_NAME" \
            --notes "KerML 10.3 project archive of the extension libraries at $GITHUB_REF_NAME, validated against the pinned OMG SysML v2 Pilot Implementation."
